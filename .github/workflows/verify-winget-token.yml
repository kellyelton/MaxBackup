name: Verify WinGet token
on:
  push:
    branches: [feature/winget-public-token-publishing]
    paths: ['.github/workflows/verify-winget-token.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate manifests with the restricted publishing token
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./.github/scripts/Submit-WinGet.ps1 -Version 0.2.34 -DryRun
      - name: Verify package-only publishing with restricted token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          function GraphQL($query, $variables) {
            $json = @{ query = $query; variables = $variables } | ConvertTo-Json -Depth 20 -Compress
            $response = Invoke-WebRequest https://api.github.com/graphql -Method Post -ContentType 'application/json' -Body $json -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'MaxBackup-token-check' }
            $result = $response.Content | ConvertFrom-Json
            if ($result.errors -or -not $result.data) { Write-Host "HTTP $($response.StatusCode): $($response.Content)"; throw 'GitHub GraphQL request failed' }
            return $result.data
          }
          $response = Invoke-WebRequest https://api.github.com/user -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'MaxBackup-token-check' }
          $scopes = $response.Headers['X-OAuth-Scopes'] -join ','
          if ($scopes.Trim() -ne 'public_repo') { throw 'Expected public_repo-only publishing token' }
          Write-Output 'Verified public_repo-only token.'
          $data = GraphQL 'query { upstream: repository(owner:"microsoft",name:"winget-pkgs") { defaultBranchRef { target { oid } } } fork: repository(owner:"kellyelton",name:"winget-pkgs") { id } }' @{}
          $branch = "maxbackup-token-check-$env:GITHUB_RUN_ID"
          $ref = $null
          try {
            $created = GraphQL 'mutation($input:CreateRefInput!) { createRef(input:$input) { ref { id } } }' @{ input = @{ repositoryId = $data.fork.id; name = "refs/heads/$branch"; oid = $data.upstream.defaultBranchRef.target.oid } }
            $ref = $created.createRef.ref.id
            $path = 'manifests/k/KellyElton/Max/Backup/0.2.34/KellyElton.Max.Backup.yaml'
            $manifest = gh api "repos/kellyelton/winget-pkgs/contents/${path}?ref=c6759bf1bf2bec3e9669a55c76c2bf3752ae1bb4" --jq .content
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read published manifest' }
            $committed = GraphQL 'mutation($input:CreateCommitOnBranchInput!) { createCommitOnBranch(input:$input) { commit { oid } } }' @{ input = @{ branch = @{ repositoryNameWithOwner = 'kellyelton/winget-pkgs'; branchName = $branch }; expectedHeadOid = $data.upstream.defaultBranchRef.target.oid; message = @{ headline = 'Verify package-only publishing permissions' }; fileChanges = @{ additions = @(@{ path = $path; contents = ($manifest -replace '\s','') }) } } }
            $commit = gh api "repos/kellyelton/winget-pkgs/commits/$branch" | ConvertFrom-Json
            $committed | ConvertTo-Json -Depth 6 | Write-Output
            @{ sha = $commit.sha; parent = $commit.parents[0].sha; expectedParent = $data.upstream.defaultBranchRef.target.oid; files = $commit.files.filename } | ConvertTo-Json | Write-Output
            if ($LASTEXITCODE -ne 0 -or $commit.files.Count -ne 1 -or $commit.files[0].filename -ne $path -or $commit.parents[0].sha -ne $data.upstream.defaultBranchRef.target.oid) { throw 'Package-only commit verification failed' }
            Write-Output "Verified package-only commit: $($commit.sha)"
          } finally {
            if ($ref) {
              $null = GraphQL 'mutation($input:DeleteRefInput!) { deleteRef(input:$input) { clientMutationId } }' @{ input = @{ refId = $ref } }
              Write-Output 'Removed temporary verification branch.'
            }
          }
